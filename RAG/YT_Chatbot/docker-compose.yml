services:
  backend:
    build:
      context: ./backend
    container_name: yt_backend

    ports:
      - "8000:8000"

    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    build:
      context: ./frontend
    container_name: yt_frontend

    ports:
      - "80:80"

    environment:
      - VITE_API_BASE_URL=http://localhost:8000

    depends_on:
      - backend